<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body { background-color: #313338; color: #dbdee1; display: flex; align-items: center; justify-content: center; height: 100vh; }
    
    .register-card { background: #2b2d31; padding: 24px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .register-card h2 { color: #f2f5f7; font-size: 20px; text-align: center; margin-bottom: 8px; }
    .register-card label { font-size: 11px; text-transform: uppercase; color: #b5bac1; font-weight: bold; }
    .register-card input { background: #1e1f22; border: 1px solid #1f2023; padding: 10px; color: #dbdee1; border-radius: 4px; outline: none; font-size: 14px; }
    .register-card button { padding: 10px; border: none; border-radius: 4px; background: #23a55a; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 6px; }
    .register-card button:hover { background: #1d8a4b; }
    .login-link { text-align: center; font-size: 12px; margin-top: 10px; color: #949ba4; }
    .login-link a { color: #5865f2; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="register-card">
    <h2>Create an Account</h2>
    
    <label>Username</label>
    <input type="text" id="reg-username" placeholder="Enter username">

    <label>Password</label>
    <input type="password" id="reg-password" placeholder="Enter password">

    <label>Profile Picture URL (Optional)</label>
    <input type="text" id="reg-avatar" placeholder="https://...">

    <button onclick="registerAccount()">Register</button>

    <div class="login-link">
      Already have an account? <a href="chat.html">Log In</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ijewmtxktfplreizuqnf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_4gRphMZV4JmvpAslZRnLcQ_owj7V5Ii';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_PFP = 'https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png';

    async function registerAccount() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const avatarUrl = document.getElementById('reg-avatar').value.trim() || DEFAULT_PFP;

      if (!username || !password) return alert("Please enter both a username and password.");

      const { data, error } = await client
        .from('profiles')
        .insert([{ 
          username, 
          password, 
          avatar_url: avatarUrl,
          is_verified: false,
          role_color: '#949ba4' 
        }]);

      if (error) {
        if (error.code === '23505') {
          alert("That username is already taken!");
        } else {
          alert("Registration failed: " + error.message);
        }
      } else {
        alert("Account created successfully! Redirecting to chat...");
        window.location.href = 'chat.html';
      }
    }
  </script>
</body>
</html>
