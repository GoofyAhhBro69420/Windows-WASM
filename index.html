<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>js-dos</title>
  <link rel="stylesheet" href="js-dos.css">
  <script src="js-dos.js"></script>
  <style>
    html, body, #dos {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="dos"></div>
  <script>
    window.onload = function() {
      if (typeof emulators !== "undefined") {
        emulators.pathPrefix = "./emulators/";
      }
      Dos(document.getElementById("dos"), {});
    };
  </script>
</body>
</html>
